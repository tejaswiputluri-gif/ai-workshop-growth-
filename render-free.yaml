services:
  - type: web
    name: nxtwave-growth-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: ADMIN_TOKEN
        sync: false
      - key: DATABASE_PATH
        value: /tmp/growth.sqlite3
      - key: STORAGE_MODE
        value: ephemeral
